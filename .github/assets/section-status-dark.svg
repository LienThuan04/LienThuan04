<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="900" height="48" role="img" aria-label="Now Playing">
  <defs><linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ed760" stop-opacity="0"/><stop offset="0.5" stop-color="#1ed760"/><stop offset="1" stop-color="#1ed760" stop-opacity="0"/>
    </linearGradient></defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #f0f6fc; }
    .meta  { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; fill: #9198a1; }
    
  </style>
  <g>
    <circle cx="18" cy="22" r="17" fill="#121212" stroke="#3d444d" stroke-width="1"/><circle cx="18" cy="22" r="15" fill="none" stroke="#2b2b2b" stroke-width="0.8"/><circle cx="18" cy="22" r="12.5" fill="none" stroke="#2b2b2b" stroke-width="0.8"/><circle cx="18" cy="22" r="10" fill="none" stroke="#2b2b2b" stroke-width="0.8"/>
    <circle cx="18" cy="22" r="6.5" fill="#1ed760"/>
    <rect x="17" y="15.5" width="2" height="4" fill="#121212" opacity="0.6"/>
    <circle cx="18" cy="22" r="1.4" fill="#121212"/>
    <animateTransform attributeName="transform" type="rotate" from="0 18 22" to="360 18 22" dur="4s" repeatCount="indefinite"/>
  </g>
  <text x="46" y="29" class="t title">Now Playing</text>
  <rect x="860" y="26" width="4.5" height="6" rx="1.5" fill="#1ed760"><animate attributeName="height" values="6;18;9;15;6" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="26;14;23;17;26" dur="0.9s" repeatCount="indefinite"/></rect>
  <rect x="868" y="18" width="4.5" height="14" rx="1.5" fill="#1ed760"><animate attributeName="height" values="14;6;18;8;14" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="18;26;14;24;18" dur="1.15s" repeatCount="indefinite"/></rect>
  <rect x="876" y="23" width="4.5" height="9" rx="1.5" fill="#1ed760"><animate attributeName="height" values="9;16;5;18;9" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="23;16;27;14;23" dur="0.8s" repeatCount="indefinite"/></rect>
  <rect x="884" y="15" width="4.5" height="17" rx="1.5" fill="#1ed760"><animate attributeName="height" values="17;8;13;6;17" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="15;24;19;26;15" dur="1.3s" repeatCount="indefinite"/></rect>
  
  <line x1="0" y1="46.5" x2="900" y2="46.5" stroke="#3d444d" stroke-width="1"/>
  <rect x="-160" y="45.75" width="160" height="1.5" fill="url(#pulse)">
    <animate attributeName="x" values="-160;900" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
